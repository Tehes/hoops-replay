<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#101820">
		<title>Court Replay · DEN @ OKC</title>
		<link rel="icon" href="icons/favicon.png">
		<link rel="stylesheet" href="css/replay.css">
	</head>
	<body>
		<main id="replay">
			<header class="scoreboard">
				<div class="team away">
				<img src="img/NBA/DEN.svg" width="48" height="48" alt="Denver Nuggets">
				<span>DEN</span><strong id="away-score">0</strong>
			</div>
				<div class="game-time"><span id="period">Q1</span><strong id="clock">12:00</strong></div>
				<div class="team home">
				<strong id="home-score">0</strong><span>OKC</span>
				<img src="img/NBA/OKC.svg" width="48" height="48" alt="Oklahoma City Thunder">
			</div>
			</header>
			<section class="court-stage">
				<canvas id="court" width="1320" height="816" title="Court Replay – Spieler für Namen antippen"></canvas>
				<p id="load-state">Replay wird vorbereitet …</p>
			</section>
			<section class="playback">
				<div class="timeline">
					<input id="timeline" type="range" min="0" max="1" value="0" step="0.001" title="Zeitpunkt im Replay"
						disabled>
					<div id="quarters">
						<button type="button" data-period="1" disabled>Q1</button>
						<button type="button" data-period="2" disabled>Q2</button>
						<button type="button" data-period="3" disabled>Q3</button>
						<button type="button" data-period="4" disabled>Q4</button>
					</div>
				</div>
				<div class="transport">
					<output id="elapsed">0:00 / 0:00</output>
					<div class="transport-buttons">
						<button id="previous" type="button" title="Vorheriger Angriff (Pfeil links)"
							disabled><svg viewBox="0 0 24 24"><path d="M5 5v14M19 5 8 12l11 7Z"/></svg></button>
						<button id="play" type="button" title="Abspielen (Leertaste)"
							disabled><svg viewBox="0 0 24 24"><path id="play-icon" d="m8 5 11 7-11 7Z"/></svg></button>
						<button id="next" type="button" title="Nächster Angriff (Pfeil rechts)"
							disabled><svg viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg></button>
					</div>
					<select id="speed" title="Abspieltempo" disabled>
						<option value="0.5">0,5×</option>
						<option value="1" selected>1×</option>
						<option value="1.5">1,5×</option>
						<option value="2">2×</option>
						<option value="4">4×</option>
					</select>
				</div>
			</section>
		</main>
		<script type="module" src="js/replay.js"></script>
	</body>
</html>
